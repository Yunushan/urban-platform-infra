# Copy this file to a private operator directory, replace every value, and sign
# the exact resulting bytes with the key referenced by the separate trust policy.
# Never commit the copied file, evidence index, kubeconfig, or evidence bodies.
version: 4

attestation:
  issuedAt: '<ISO-8601 timestamp>'
  expiresAt: '<ISO-8601 timestamp no more than 24 hours after issuedAt>'

release:
  tag: v1.0.0
  owner: '<release-owner-id>'
  sourceRevision: '<40-or-64-hex-source-revision>'
  deploymentId: '<new UUIDv4 for this rollout>'
  valuesOverlay: /private/production/values-production-private.yaml
  valuesOverlaySha256: sha256:<64-hex-digest>

registry:
  privateRegistry: registry.example.invalid/platform
  evidenceRoot: /private/production/image-evidence
  imageEvidenceIndex: image-evidence-index.yaml
  imageEvidenceIndexSha256: sha256:<64-hex-digest>
  maximumEvidenceAgeDays: 30

disasterRecovery:
  evidenceRoot: /private/production/dr-evidence
  maximumEvidenceAgeDays: 180
  artifacts:
    rtoRpo:
      path: rto-rpo.yaml
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    dependencyMap:
      path: dependency-map.yaml
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    criticalityMap:
      path: criticality-map.yaml
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    backupReplication:
      path: backup-replication.md
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    dataReplication:
      path: data-replication.md
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    crossZonePlacement:
      path: cross-zone-placement.md
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    databaseRestore:
      path: database-restore-drill.md
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    etcdRestore:
      path: etcd-restore-drill.md
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    namespaceRestore:
      path: namespace-restore-drill.md
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    applicationSmokeTest:
      path: application-smoke-test.md
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    runbook:
      path: recovery-runbook.md
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    commsPlan:
      path: continuity-comms.md
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    manualWorkaround:
      path: degraded-mode.md
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    supplierContacts:
      path: supplier-ownership.md
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    drillEvidence:
      path: restore-drill-evidence.md
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    rtoEvidence:
      path: measured-rto.md
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'
    postDrillReview:
      path: post-drill-review.md
      sha256: sha256:<64-hex-digest>
      capturedAt: '<ISO-8601 timestamp>'
      approvedBy: '<reviewer-id>'

liveCluster:
  required: true
  kubeconfig: /private/production/operator.kubeconfig
  clusterUid: '<kube-system Namespace metadata.uid>'
  namespace: urban-platform
  minimumReadyNodes: 3
  failureDomainLabel: kubernetes.io/hostname
  expectedPodSecurityVersion: v1.34
  expectedPostgresClusters: 18
  expectedKafkaVersion: 4.3.0
  # Include every chart-managed and operator-managed PDB in the signed list.
  expectedPodDisruptionBudgets:
    - redis
    - webserver-nginx
    - zabbix-agent2
  expectedAutoscalers:
    - webserver-nginx
  ingressProbe:
    required: true
    # Use the real production DNS name or a certificate-valid VIP address.
    # The probe runner bypasses configured HTTP proxies and performs a real GET.
    httpsUrl: https://platform.example.invalid/login
    httpUrl: http://platform.example.invalid/login
    expectedHttpsStatusCodes: [200, 401, 403]
    expectedHttpStatusCodes: [301, 302, 307, 308]
    requireHttpRedirect: true
    tlsVerify: true
    # Optional PEM bundle for a private enterprise CA; omit for public CA trust.
    caBundle: /private/production/ingress-ca.pem
