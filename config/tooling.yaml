version: 1
description: Public-safe mandatory and optional tool contract by execution scope.
scopes:
  validation:
    description: Repository syntax, policy, and disclosure validation.
    mandatory:
    - python
    - git
    - make
    - bash
    - yamllint
    - shellcheck
    optional:
    - ansible
    - helm
    - helmfile
  deployment:
    description: Cluster bootstrap and Helm deployment from a Linux operator host.
    mandatory:
    - python
    - git
    - make
    - bash
    - ansible-playbook
    - ansible-galaxy
    - helm
    - helmfile
    - kubectl
    - ssh
    - scp
    - openssl
    optional:
    - docker-or-podman
    - shellcheck
  import:
    description: Compose import, image build, database migration, and RKE2 preload.
    mandatory:
    - python
    - git
    - make
    - bash
    - kubectl
    - ssh
    - scp
    - openssl
    optional:
    - docker-or-podman
    - pg-tools
    - helm
    - helmfile
  production-evidence:
    description: Signed private release evidence and authenticated live-cluster verification.
    mandatory:
    - python
    - git
    - kubectl
    - cosign
    optional: []
  load-test:
    description: Controlled optional load generation with Kubernetes resource and I/O measurement.
    mandatory:
    - python
    optional:
    - kubectl
    - k6
    - locust
    - jmeter
    - gatling
    - artillery
    - fortio
    - vegeta
    - wrk2
    - kafka-perf
    - pgbench
    - hey
    - fio
    - iostat
  management-tools:
    description: Explicitly selected Kubernetes and Docker management-tool operations.
    mandatory:
    - python
    optional:
    - helm
    - kubectl
    - docker-or-podman
    - k9s
    - freelens
  all:
    description: Union of validation, deployment, import, production-evidence, load-test, and management-tool requirements.
    mandatory: []
    optional: []
tools:
  python:
    displayName: Python 3.11+
    commands:
    - python3
    - python
    versionArgs:
    - --version
  git:
    displayName: Git
    commands:
    - git
    versionArgs:
    - --version
  make:
    displayName: GNU Make
    commands:
    - make
    versionArgs:
    - --version
  bash:
