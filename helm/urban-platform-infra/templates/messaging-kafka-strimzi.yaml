{{- $kafkaProvider := .Values.messaging.kafka.provider | default "confluent" }}
{{- if and .Values.messaging.kafka.enabled (eq $kafkaProvider "strimzi") }}
{{- $kafkaReplicas := int (include "cip.replicaCount" (list . (.Values.messaging.kafka.replicas | default 3))) }}
{{- $kafkaStorageClass := include "cip.storageClassName" (list . (.Values.messaging.kafka.storage.className | default "") "hot") }}
{{- $kafkaReplicationFactor := int (min 3 $kafkaReplicas) }}
{{- $kafkaMinIsr := int (max 1 (sub $kafkaReplicationFactor 1)) }}
{{- $strimzi := .Values.messaging.kafka.strimzi | default dict }}
{{- $strimziListeners := $strimzi.listeners | default dict }}
{{- $strimziPlainListener := $strimziListeners.plain | default dict }}
{{- $strimziTlsListener := $strimziListeners.tls | default dict }}
{{- $strimziEntityOperator := $strimzi.entityOperator | default dict }}
{{- $strimziApiVersion := $strimzi.apiVersion | default "kafka.strimzi.io/v1" }}
{{- $strimziResources := $strimzi.resources | default .Values.messaging.kafka.resources }}
{{- $strimziAuthorization := $strimzi.authorization | default dict }}
{{- $strimziRack := $strimzi.rack | default dict }}
{{- $strimziBrokerConfig := $strimzi.brokerConfig | default dict }}
{{- $strimziScheduling := $strimzi.scheduling | default dict }}
{{- $strimziPdb := $strimzi.podDisruptionBudget | default dict }}
{{- $strimziExporter := $strimzi.kafkaExporter | default dict }}
{{- $strimziCruiseControl := $strimzi.cruiseControl | default dict }}
{{- $strimziMetrics := $strimzi.metrics | default dict }}
{{- $strimziOperatorImage := $strimzi.operatorImage | default dict }}
{{- $imagePullSecrets := .Values.global.imagePullSecrets | default list }}
{{- $plainListenerEnabled := true }}
{{- if hasKey $strimziPlainListener "enabled" }}
{{- $plainListenerEnabled = $strimziPlainListener.enabled }}
{{- end }}
{{- $entityOperatorEnabled := true }}
{{- if hasKey $strimziEntityOperator "enabled" }}
{{- $entityOperatorEnabled = $strimziEntityOperator.enabled }}
{{- end }}
{{- $topicOperatorEnabled := true }}
{{- if hasKey $strimziEntityOperator "topicOperator" }}
{{- $topicOperatorEnabled = $strimziEntityOperator.topicOperator }}
{{- end }}
{{- $userOperatorEnabled := true }}
{{- if hasKey $strimziEntityOperator "userOperator" }}
{{- $userOperatorEnabled = $strimziEntityOperator.userOperator }}
{{- end }}
{{- $autoCreateTopics := true }}
{{- if hasKey $strimziBrokerConfig "autoCreateTopics" }}
{{- $autoCreateTopics = $strimziBrokerConfig.autoCreateTopics }}
{{- end }}
{{- $kafkaClientPort := int (.Values.messaging.kafka.ports.client | default 9092) }}
{{- if and (not $plainListenerEnabled) ($strimziTlsListener.enabled | default false) }}
{{- $kafkaClientPort = 9093 }}
{{- end }}
{{- if ($strimziMetrics.enabled | default false) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $strimziMetrics.configMapName | default "kafka-metrics" | quote }}
  namespace: {{ include "cip.namespace" . }}
  labels:
    {{- include "cip.labels" . | nindent 4 }}
data:
  {{ $strimziMetrics.configMapKey | default "kafka-metrics-config.yml" }}: |
    lowercaseOutputName: true
    rules:
      - pattern: kafka.server<type=(.+), name=(.+)PerSec\w*><>Count
        name: kafka_server_$1_$2_total
        type: COUNTER
      - pattern: kafka.server<type=(.+), name=(.+)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
      - pattern: kafka.controller<type=(.+), name=(.+)><>Value
        name: kafka_controller_$1_$2
        type: GAUGE
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka
  namespace: {{ include "cip.namespace" . }}
  labels:
    {{- include "cip.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.prometheus.releaseLabel | default "kube-prometheus-stack" | quote }}
spec:
  selector:
    matchLabels:
      strimzi.io/cluster: kafka
      strimzi.io/kind: Kafka
  podMetricsEndpoints:
    - path: /metrics
      port: tcp-prometheus
{{- end }}
---
apiVersion: {{ $strimziApiVersion }}
kind: KafkaNodePool
metadata:
  name: {{ $strimzi.nodePoolName | default "dual-role" | quote }}
  namespace: {{ include "cip.namespace" . }}
  labels:
    strimzi.io/cluster: kafka
    {{- include "cip.labels" . | nindent 4 }}
spec:
  replicas: {{ $kafkaReplicas }}
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.messaging.kafka.storage.size | default "50Gi" | quote }}
{{- if $kafkaStorageClass }}
        class: {{ $kafkaStorageClass | quote }}
{{- end }}
        deleteClaim: {{ $strimzi.deleteClaim | default false }}
  {{- with $strimziResources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: {{ $strimziApiVersion }}
kind: Kafka
metadata:
  name: kafka
  namespace: {{ include "cip.namespace" . }}
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
  labels:
    {{- include "cip.labels" . | nindent 4 }}
spec:
  kafka:
    version: {{ $strimzi.kafkaVersion | default .Values.messaging.kafka.image.tag | quote }}
    {{- if ($strimzi.useCustomKafkaImage | default false) }}
    image: {{ include "cip.image" (list . .Values.messaging.kafka.image) | quote }}
    {{- end }}
    {{- if $strimzi.metadataVersion }}
    metadataVersion: {{ $strimzi.metadataVersion | quote }}
    {{- end }}
    listeners:
      {{- if $plainListenerEnabled }}
      - name: plain
        port: {{ .Values.messaging.kafka.ports.client | default 9092 }}
        type: internal
        tls: false
      {{- end }}
      {{- if ($strimziTlsListener.enabled | default false) }}
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: {{ $strimziTlsListener.authentication | default "tls" | quote }}
      {{- end }}
    {{- if ($strimziAuthorization.enabled | default false) }}
    authorization:
      type: {{ $strimziAuthorization.type | default "simple" | quote }}
      {{- with $strimziAuthorization.superUsers }}
      superUsers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- if ($strimziRack.enabled | default false) }}
    rack:
      topologyKey: {{ $strimziRack.topologyKey | default "topology.kubernetes.io/zone" | quote }}
    {{- end }}
    config:
      offsets.topic.replication.factor: {{ $kafkaReplicationFactor }}
      transaction.state.log.replication.factor: {{ $kafkaReplicationFactor }}
      transaction.state.log.min.isr: {{ $kafkaMinIsr }}
      default.replication.factor: {{ $kafkaReplicationFactor }}
      min.insync.replicas: {{ $kafkaMinIsr }}
      auto.create.topics.enable: {{ $autoCreateTopics }}
      unclean.leader.election.enable: {{ $strimziBrokerConfig.uncleanLeaderElection | default false }}
      num.partitions: {{ $strimziBrokerConfig.numPartitions | default 3 }}
    {{- if ($strimziMetrics.enabled | default false) }}
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: {{ $strimziMetrics.configMapName | default "kafka-metrics" | quote }}
          key: {{ $strimziMetrics.configMapKey | default "kafka-metrics-config.yml" | quote }}
    {{- end }}
    {{- if or ($strimziScheduling.enabled | default false) $imagePullSecrets }}
    template:
      pod:
        {{- with $imagePullSecrets }}
        imagePullSecrets:
          {{- range . }}
          - name: {{ . | quote }}
          {{- end }}
        {{- end }}
        {{- if ($strimziScheduling.enabled | default false) }}
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                strimzi.io/cluster: kafka
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                strimzi.io/cluster: kafka
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    strimzi.io/cluster: kafka
                topologyKey: kubernetes.io/hostname
        {{- end }}
      {{- if ($strimziScheduling.enabled | default false) }}
      podDisruptionBudget:
        maxUnavailable: {{ $strimziPdb.maxUnavailable | default 1 }}
      {{- end }}
    {{- end }}
  {{- if ($strimziExporter.enabled | default false) }}
  kafkaExporter:
    {{- if ($strimzi.useCustomKafkaImage | default false) }}
    image: {{ include "cip.image" (list . .Values.messaging.kafka.image) | quote }}
    {{- end }}
    topicRegex: {{ $strimziExporter.topicRegex | default ".*" | quote }}
    groupRegex: {{ $strimziExporter.groupRegex | default ".*" | quote }}
  {{- end }}
  {{- if ($strimziCruiseControl.enabled | default false) }}
  {{- if ($strimzi.useCustomKafkaImage | default false) }}
  cruiseControl:
    image: {{ include "cip.image" (list . .Values.messaging.kafka.image) | quote }}
  {{- else }}
  cruiseControl: {}
  {{- end }}
  {{- end }}
  {{- if $entityOperatorEnabled }}
  entityOperator:
    {{- if $topicOperatorEnabled }}
    {{- if and ($strimzi.useCustomKafkaImage | default false) $strimziOperatorImage.repository }}
    topicOperator:
      image: {{ include "cip.image" (list . $strimziOperatorImage) | quote }}
    {{- else }}
    topicOperator: {}
    {{- end }}
    {{- end }}
    {{- if $userOperatorEnabled }}
    {{- if and ($strimzi.useCustomKafkaImage | default false) $strimziOperatorImage.repository }}
    userOperator:
      image: {{ include "cip.image" (list . $strimziOperatorImage) | quote }}
    {{- else }}
    userOperator: {}
    {{- end }}
    {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ include "cip.namespace" . }}
  labels:
    {{- include "cip.labels" . | nindent 4 }}
    app.kubernetes.io/name: kafka
spec:
  type: ExternalName
  externalName: {{ printf "%s.%s.svc.cluster.local" ($strimzi.bootstrapService | default "kafka-kafka-bootstrap") (include "cip.namespace" .) | quote }}
  ports:
    - name: client
      port: {{ $kafkaClientPort }}
      targetPort: {{ $kafkaClientPort }}
{{- if .Values.messaging.kafka.ui.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: {{ include "cip.namespace" . }}
  labels:
    {{- include "cip.labels" . | nindent 4 }}
    app.kubernetes.io/name: kafka-ui
spec:
  replicas: {{ include "cip.replicaCount" (list . (.Values.messaging.kafka.ui.replicas | default 2)) }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-ui
        app.kubernetes.io/part-of: urban-platform-infra
    spec:
      {{- include "cip.podSpecDefaults" . | nindent 6 }}
      {{- with .Values.messaging.kafka.ui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- if .Values.global.podSecurityContext.enabled }}
      securityContext:
        {{- include "cip.compatPodSecurityContext" . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: kafka-ui
          image: {{ include "cip.image" (list . .Values.messaging.kafka.ui.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | quote }}
          securityContext:
            {{- with .Values.messaging.kafka.ui.securityContext }}
            {{- toYaml . | nindent 12 }}
            {{- else }}
            {{- include "cip.compatSecurityContext" . | nindent 12 }}
            {{- end }}
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: urban-platform
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: {{ printf "kafka:%d" $kafkaClientPort | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.messaging.kafka.ui.port | default 8080 }}
          {{- with .Values.messaging.kafka.ui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: {{ include "cip.namespace" . }}
spec:
  selector:
    app.kubernetes.io/name: kafka-ui
  ports:
    - name: http
      port: {{ .Values.messaging.kafka.ui.port | default 8080 }}
      targetPort: {{ .Values.messaging.kafka.ui.port | default 8080 }}
{{- end }}
{{- end }}
