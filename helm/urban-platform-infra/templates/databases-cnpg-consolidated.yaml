{{- if and .Values.databases.enabled (eq .Values.databases.provider "cloudnative-pg") }}
{{- $databaseTopology := .Values.databases.topology | default dict }}
{{- $databaseTopologyMode := $databaseTopology.mode | default "per-service" }}
{{- $consolidated := $databaseTopology.consolidated | default dict }}
{{- $hybrid := $databaseTopology.hybrid | default dict }}
{{- $includeConfig := $consolidated }}
{{- if eq $databaseTopologyMode "hybrid" }}
{{- $includeConfig = $hybrid }}
{{- end }}
{{- $consolidatedEngines := $includeConfig.includeEngines | default (list "postgresql") }}
{{- if and (ne $databaseTopologyMode "per-service") ($consolidated.enabled | default true) }}
{{- $name := required "databases.topology.consolidated.name is required when database topology is consolidated or hybrid" $consolidated.name }}
{{- $engine := lower ($consolidated.engine | default "postgresql") }}
{{- $database := required "databases.topology.consolidated.database is required" $consolidated.database }}
{{- $owner := required "databases.topology.consolidated.owner is required" $consolidated.owner }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $name) }}
{{- fail (printf "databases.topology.consolidated.name must be a DNS-compatible Kubernetes name: %s" $name) }}
{{- end }}
{{- if or (not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $database)) (not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $owner)) }}
{{- fail "databases.topology.consolidated.database and owner must contain only letters, numbers, and underscores and start with a letter or underscore" }}
{{- end }}
{{- $postInitSQL := list }}
{{- range $sourceName, $source := .Values.databases.instances }}
{{- if and $source $source.enabled }}
{{- $sourceEngine := lower ($source.engine | default "postgresql") }}
{{- if has $sourceEngine $consolidatedEngines }}
{{- $sourceDatabase := $source.database | default $sourceName }}
{{- if ne $sourceDatabase $database }}
{{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $sourceDatabase) }}
{{- fail (printf "databases.instances.%s.database cannot be created by consolidated topology because it is not a safe SQL identifier" $sourceName) }}
{{- end }}
{{- $postInitSQL = append $postInitSQL (printf "CREATE DATABASE \"%s\" OWNER \"%s\";" $sourceDatabase $owner) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $storageOverride := $.Values.databases.storageOverride | default dict }}
{{- $consolidatedStorage := $consolidated.storage | default dict }}
{{- $storageSize := $storageOverride.size | default $consolidatedStorage.size | default "20Gi" }}
{{- $explicitStorageClass := $storageOverride.className | default $consolidatedStorage.className | default "" }}
{{- $storageClass := include "cip.storageClassName" (list $ $explicitStorageClass "hot") }}
{{- $postgresUID := $consolidated.postgresUID | default $.Values.databases.postgresUID }}
{{- $postgresGID := $consolidated.postgresGID | default $.Values.databases.postgresGID }}
{{- $resources := $consolidated.resources | default $.Values.databases.resources }}
{{- $globalBackup := $.Values.databases.backup | default dict }}
{{- $dbBackup := $consolidated.backup | default dict }}
{{- $globalObjectStore := $globalBackup.objectStore | default dict }}
{{- $dbObjectStore := $dbBackup.objectStore | default dict }}
{{- $storageTiers := $.Values.storageTiers | default dict }}
{{- $coldTier := get $storageTiers "cold" | default dict }}
{{- $coldObjectStore := $coldTier.objectStore | default dict }}
{{- $backupSecretRef := $coldObjectStore.secretRef | default dict }}
{{- if $globalObjectStore.secretRef }}
{{- $backupSecretRef = $globalObjectStore.secretRef | default dict }}
{{- end }}
{{- if $dbObjectStore.secretRef }}
{{- $backupSecretRef = $dbObjectStore.secretRef | default dict }}
{{- end }}
{{- $backupEnabled := or ($globalBackup.enabled | default false) ($dbBackup.enabled | default false) }}
{{- $backupObjectStoreEnabled := or ($globalObjectStore.enabled | default false) ($dbObjectStore.enabled | default false) ($coldObjectStore.enabled | default false) }}
{{- $backupProvider := coalesce $dbObjectStore.provider $globalObjectStore.provider $coldObjectStore.provider "s3-compatible" }}
{{- $backupSecretName := coalesce $backupSecretRef.name "" }}
{{- $backupBucket := coalesce $dbObjectStore.bucket $globalObjectStore.bucket $coldObjectStore.bucket "" }}
{{- $backupPrefix := coalesce $dbObjectStore.prefix $globalObjectStore.prefix $coldObjectStore.prefix "urban-platform/databases" }}
{{- $backupSafePrefix := trimAll "/" $backupPrefix }}
{{- $backupDestinationPath := coalesce $dbObjectStore.destinationPath $globalObjectStore.destinationPath $coldObjectStore.destinationPath "" }}
{{- $backupEndpointURL := coalesce $dbObjectStore.endpointURL $globalObjectStore.endpointURL $coldObjectStore.endpointURL "" }}
{{- $backupCompression := coalesce $dbObjectStore.compression $globalBackup.compression "gzip" }}
{{- $backupReady := and $backupEnabled $backupObjectStoreEnabled $backupSecretName (or $backupDestinationPath $backupBucket) (or (eq $backupProvider "s3-compatible") (eq $backupProvider "aws-s3")) }}
{{- $globalBackupSchedule := $globalBackup.schedule | default dict }}
{{- $dbBackupSchedule := $dbBackup.schedule | default dict }}
{{- $backupScheduleEnabled := and $backupReady (or ($globalBackupSchedule.enabled | default false) ($dbBackupSchedule.enabled | default false)) }}
{{- $backupScheduleCron := coalesce $dbBackupSchedule.cron $globalBackupSchedule.cron "0 0 2 * * *" }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $name }}
  namespace: {{ include "cip.namespace" $ }}
  labels:
    {{- include "cip.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
    urban-platform.io/database-engine: {{ $engine | quote }}
    urban-platform.io/database-topology: {{ $databaseTopologyMode | quote }}
spec:
  instances: {{ include "cip.replicaCount" (list $ ($consolidated.instances | default $.Values.databases.defaultInstances)) }}
  {{- with $resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if $postgresUID }}
  postgresUID: {{ $postgresUID }}
  {{- end }}
  {{- if $postgresGID }}
  postgresGID: {{ $postgresGID }}
  {{- end }}
  imageName: {{ include "cip.image" (list $ $consolidated.image) | quote }}
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: {{ $database | quote }}
      owner: {{ $owner | quote }}
      {{- if $postInitSQL }}
      postInitSQL:
        {{- toYaml $postInitSQL | nindent 8 }}
      {{- end }}
  storage:
    size: {{ $storageSize }}
    {{- if $storageClass }}
    storageClass: {{ $storageClass | quote }}
    {{- end }}
  {{- if $backupReady }}
  backup:
    retentionPolicy: {{ coalesce $dbBackup.retentionPolicy $globalBackup.retentionPolicy "30d" | quote }}
    barmanObjectStore:
      {{- if $backupDestinationPath }}
      destinationPath: {{ $backupDestinationPath | quote }}
      {{- else if $backupSafePrefix }}
      destinationPath: {{ printf "s3://%s/%s/%s" $backupBucket $backupSafePrefix $name | quote }}
      {{- else }}
      destinationPath: {{ printf "s3://%s/%s" $backupBucket $name | quote }}
      {{- end }}
      serverName: {{ $name | quote }}
      {{- if $backupEndpointURL }}
      endpointURL: {{ $backupEndpointURL | quote }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ $backupSecretName | quote }}
          key: {{ coalesce $backupSecretRef.accessKeyIdKey "accessKeyId" | quote }}
        secretAccessKey:
          name: {{ $backupSecretName | quote }}
          key: {{ coalesce $backupSecretRef.secretAccessKeyKey "secretAccessKey" | quote }}
      wal:
        compression: {{ $backupCompression | quote }}
      data:
        compression: {{ $backupCompression | quote }}
  {{- end }}
  {{- if $.Values.databases.monitoring.enableDeprecatedPodMonitor }}
  monitoring:
    enablePodMonitor: true
  {{- end }}
{{- if $backupScheduleEnabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ printf "%s-backup" $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "cip.namespace" $ }}
  labels:
    {{- include "cip.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-backup" $name | trunc 63 | trimSuffix "-" }}
    urban-platform.io/database-engine: {{ $engine | quote }}
    urban-platform.io/database-topology: {{ $databaseTopologyMode | quote }}
spec:
  schedule: {{ $backupScheduleCron | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ $name }}
{{- end }}
{{- end }}
{{- end }}
