{{- if .Values.zabbixAgent.enabled }}
{{- $zabbixReplicas := int (include "cip.replicaCount" (list . (.Values.zabbixAgent.replicas | default 3))) -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-agent2
  namespace: {{ include "cip.namespace" . }}
  labels:
    {{- include "cip.labels" . | nindent 4 }}
    app.kubernetes.io/name: zabbix-agent2
spec:
  replicas: {{ $zabbixReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zabbix-agent2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zabbix-agent2
        app.kubernetes.io/part-of: urban-platform-infra
    spec:
      {{- include "cip.podSpecDefaults" . | nindent 6 }}
      {{- with .Values.zabbixAgent.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- if .Values.global.podSecurityContext.enabled }}
      securityContext:
        {{- include "cip.podSecurityContext" . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if .Values.global.scheduling.topologySpread }}
      topologySpreadConstraints:
        {{- include "cip.topologySpreadConstraints" (list . "zabbix-agent2") | nindent 8 }}
      {{- end }}
      {{- if ne (.Values.global.scheduling.antiAffinity | default "preferred") "disabled" }}
      affinity:
        podAntiAffinity:
          {{- include "cip.podAntiAffinity" (list . "zabbix-agent2") | nindent 10 }}
      {{- end }}
      containers:
        - name: zabbix-agent2
          image: {{ include "cip.image" (list . .Values.zabbixAgent.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | quote }}
          securityContext:
            {{- with .Values.zabbixAgent.securityContext }}
            {{- toYaml . | nindent 12 }}
            {{- else }}
            {{- include "cip.securityContext" . | nindent 12 }}
            {{- end }}
          ports:
            {{- range .Values.zabbixAgent.ports }}
            - name: {{ .name | quote }}
              containerPort: {{ .containerPort }}
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-agent2
  namespace: {{ include "cip.namespace" . }}
  labels:
    {{- include "cip.labels" . | nindent 4 }}
    app.kubernetes.io/name: zabbix-agent2
spec:
  selector:
    app.kubernetes.io/name: zabbix-agent2
  ports:
    {{- range .Values.zabbixAgent.ports }}
    - name: {{ .name | quote }}
      port: {{ .servicePort }}
      targetPort: {{ .containerPort }}
    {{- end }}
{{- if and (eq (.Values.global.environment | default "") "production") (gt $zabbixReplicas 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zabbix-agent2
  namespace: {{ include "cip.namespace" . }}
  labels:
    {{- include "cip.labels" . | nindent 4 }}
    app.kubernetes.io/name: zabbix-agent2
spec:
  minAvailable: {{ max 1 (sub $zabbixReplicas 1) }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zabbix-agent2
{{- end }}
{{- end }}
