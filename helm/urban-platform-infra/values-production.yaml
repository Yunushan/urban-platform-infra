# Public-safe production contract overlay.
#
# Supply deployment-specific registry, issuer, storage, and secret values in a
# private values file or via --set. This file deliberately contains no private
# addresses, credentials, or customer identifiers.
global:
  environment: production
  # The private production overlay must set these to the signed release tag and
  # immutable source revision before promotion.
  releaseIdentity:
    enabled: true
    tag: ''
    sourceRevision: ''
    deploymentId: ''
  imagePullSecrets:
    - registry-credentials
  defaultReplicas: 3
  replicaOverride: null
  skipPlaceholderWorkloads: true
  imagePullPolicy: IfNotPresent
  scheduling:
    topologySpread: true
    antiAffinity: required
    topologySpreadWhenUnsatisfiable: DoNotSchedule
  resourceDefaults:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
      ephemeral-storage: 2Gi
  ioCost:
    enabled: true
    measurement: cgroup-v2
    sampleIntervalSeconds: 5
    maxReadBytesPerSecond: 0
    maxWriteBytesPerSecond: 0
    maxReadIops: 0
    maxWriteIops: 0

  security:
    runAsNonRoot: true
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    enabled: true
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

# Management tools are deliberately excluded from the production application
# release. Enable them only with an explicit, separately reviewed operation.
managementTools:
  enabled: false
  mode: plan
  requireExplicitSelection: true
  requirePinnedVersions: true
  requireDigestPins: true
  allowMutableTags: false
  allowDockerSocket: false
  requirePrivateEnvironmentFile: true
  inCluster:
    tlsRequired: true
    valuesDirectory: ''
    defaultStorageClass: ''
  rancher:
    enabled: false
    chartVersion: ''
    valuesFile: ''
    namespace: cattle-system
    releaseName: rancher
    host: ''
    tlsSecretName: ''
    dedicatedManagementCluster: true
  portainer:
    enabled: false
    chartVersion: ''
    valuesFile: ''
    namespace: portainer
    releaseName: portainer
    host: ''
    tlsSecretName: ''
    storageClass: ''
  headlamp:
    enabled: false
    chartVersion: ''
    valuesFile: ''
    namespace: headlamp
    releaseName: headlamp
    host: ''
    tlsSecretName: ''
  devtron:
    enabled: false
    chartVersion: ''
    valuesFile: ''
    namespace: devtroncd
    releaseName: devtron-operator
    host: ''
    tlsSecretName: ''
    storageClass: ''
  freelens:
    enabled: false
    version: 1.10.3
    kubeconfigContext: ''
  k9s:
    enabled: false
    version: 0.51.0
    kubeconfigContext: ''
  komodo:
    enabled: false
    composeProfile: komodo
    externalHost: ''
    environmentFile: ''
    coreImage: ''
    peripheryImage: ''
    mongoImage: ''
    peripheryRootDirectory: ''
  arcane:
    enabled: false
    composeProfile: arcane
    externalHost: ''
    environmentFile: ''
    image: ''
    projectsDirectory: ''
    buildsDirectory: ''

imagePromotionController:
  enabled: true
  profile: enterprise-signed
  executionMode: enforce
  imageMode: registry
  requireDigestPins: true
  requireVulnerabilityScan: true
  requireSbom: true
  requireSignatureOrAttestation: true
  requirePromotionRecord: true

runtimeHardening:
  enabled: true
  profile: production-restricted
  enforcementMode: enforce
  policyEngine: native-psa
  podSecurity:
    targetEnforce: restricted
    targetAudit: restricted
    targetWarn: restricted
    requirePinnedVersion: true
  workloadSecurity:
    requireRunAsNonRoot: true
    requireReadOnlyRootFilesystem: false
    requireRuntimeDefaultSeccomp: true
    requireDropAllCapabilities: true
    disallowPrivilegeEscalation: true
    disallowHostNamespaces: true
  images:
    requireDigestPins: true
    requireSignatureVerification: true
    deniedTags:
      - latest
      - latest-pg16
      - latest-pg17
      - latest-pg18

gitOpsDelivery:
  enabled: true
  profile: production-argocd
  controller: argocd
  reconciliation: automated
  driftDetection: enforce
  prune: true
  selfHeal: true

progressiveDelivery:
  enabled: true
  profile: production-canary
  strategy: canary
  controller: argo-rollouts
  trafficProvider: traefik
  rollback:
    automatic: true
    requireSmokeTests: true
    requireRollbackDrill: true

scalingPolicy:
  enabled: true
  profile: production-hpa
  mode: hpa
  metricsSource: metrics-server
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70

networkConnectivity:
  enabled: true
  profile: production-restricted
  mode: restricted-networkpolicy
  networkPolicy:
    enabled: true
    profile: production-default-deny
    defaultDeny: true
    dnsEgress: true
    kubernetesApiEgress: true
    externalWebEgress: false
  egress:
    mode: explicit-cidrs
    requireExplicitCidrs: true
  tls:
    mode: trusted-issuer
    requireTrustedIssuer: true

accessGovernance:
  enabled: true
  profile: oidc-sso
  mode: oidc
  rbac:
    enabled: true
    strategy: least-privilege
    requireLeastPrivilege: true
    serviceAccountTokenAutomount: false
  identity:
    enabled: true
    provider: external-oidc
    requireMfa: true
    requireGroupMapping: true
  audit:
    enabled: true
    mode: centralized
    requireAuditPolicy: true

complianceEvidence:
  enabled: true
  profile: production-audit-pack
  mode: audit-pack
  evidence:
    collectReports: true
    requirePrivateIndex: true
    requireReleaseTag: true
    requireControlMap: true
    requireRestoreDrill: true
    requireAccessReview: true
    requireIncidentDrill: true
  retention:
    enabled: true
    days: 365
    storageTier: cold
  packaging:
    enabled: true
    format: audit-pack
    includeChecksums: true
    includeAttestations: true

incidentResponse:
  enabled: true
  profile: production-oncall
  mode: oncall
  severityModel: sev1-sev4
  alerting:
    enabled: true
    requireAlertRoutes: true
    requirePaging: true
    requireQuietHours: true
  runbooks:
    enabled: true
    requireRunbookIndex: true
    requireServiceOwnership: true
    requireRollbackSteps: true
  drills:
    enabled: true
    requireIncidentDrill: true
    requirePostIncidentReview: true

changeManagement:
  enabled: true
  profile: production-cab
  mode: cab
  approvalModel: cab
  changeControl:
    enabled: true
    requireChangeTicket: true
    requireApprovals: true
    requireRiskAssessment: true
    requireImpactAssessment: true
  maintenanceWindow:
    enabled: true
    requireWindow: true
    requireFreezeCheck: true
  rollout:
    enabled: true
    requireRollbackPlan: true

cutoverGates:
  enabled: true
  profile: production-cutover
  mode: production
  trafficSwitch:
    enabled: true
    method: ingress-dns
    requireIngressHost: true
    requireDnsTlsEvidence: true
  preCutover:
    requireImportPreflight: true
    requireCapacityReport: true
    requireReleaseEvidence: true
    requireRegistryEvidence: true
    requireBackupRestoreEvidence: true
    requireDatabaseRestoreEvidence: true
    requireChangeTicket: true
    requireApprovalEvidence: true
  smokeTests:
    enabled: true
    requireSmokeTestPlan: true
    requirePostMigrationCheck: true
    requireSyntheticChecks: true
  rollback:
    enabled: true
    requireRollbackPlan: true
    requireRecoveryPlan: true
    requireRestorePoint: true
  postCutover:
    enabled: true
    requireObservationWindow: true
    requireOwnerHandoff: true

smokeTesting:
  enabled: true
  profile: production-smoke
  mode: production
  execution:
    enabled: true
    runner: kubernetes-job
    namespace: urban-platform
  probes:
    kubernetesRollout: true
    httpRoutes: true
    tcpServices: true
    databaseConnections: true
    messagingConnections: true
    externalSynthetic: true
  evidence:
    requirePlan: true
    requireResults: true
    requireOwnerReview: true

releaseRunbook:
  enabled: true
  profile: production-release
  mode: production
  gates:
    requireReleaseTag: true
    requireCleanWorktree: true
    requireArtifactEvidence: true
    requireSbom: true
    requireChecksums: true
    requireAttestation: true
    requireChangeApproval: true
    requireSmokeTestPlan: true
    requireCutoverGate: true
    requireRollbackPlan: true
  evidence:
    requirePublicBundle: true
    requirePrivateApprovalIndex: true
    requireOwnerReview: true

clusterUpgrade:
  enabled: true
  profile: production-upgrade
  mode: production
  orchestration:
    enabled: true
    strategy: manual-plan
    drainNodes: true
    restartServices: true
  gates:
    requirePinnedVersion: true
    requireSupportedSkew: true
    requireEtcdSnapshot: true
    requireBackupRestore: true
    requireMaintenanceWindow: true
    requireCapacityHeadroom: true
    requireNodeHealth: true
    requireRollbackPlan: true
    requireAddOnCompatibility: true
    requirePostUpgradeSmokeTest: true
  evidence:
    requireClusterDoctor: true
    requireInventoryReview: true
    requireReleaseNotesReview: true
    requireOwnerApproval: true

disasterRecovery:
  enabled: true
  profile: production-dr
  mode: production
  tier: critical
  failoverModel: active-passive
  recoveryObjectives:
    enabled: true
    requireRtoRpo: true
    requireDependencyMap: true
    requireCriticalityMap: true
  replication:
    enabled: true
    requireBackupReplication: true
    requireDataReplication: true
    requireCrossZonePlacement: true
  restoreDrills:
    enabled: true
    requireDatabaseRestore: true
    requireEtcdRestore: true
    requireNamespaceRestore: true
    requireApplicationSmokeTest: true
  continuity:
    enabled: true
    requireRunbook: true
    requireCommsPlan: true
    requireManualWorkaround: true
    requireSupplierContacts: true
  evidence:
    enabled: true
    requireDrillEvidence: true
    requireRtoEvidence: true
    requirePostDrillReview: true

namespace:
  limitRange:
    default:
      cpu: 1
      memory: 1Gi
      ephemeral-storage: 2Gi
    defaultRequest:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 512Mi
  podSecurity:
    enforce: restricted
    audit: restricted
    warn: restricted
    # Pin this to the Kubernetes minor used by the production cluster.
    version: v1.34
  resourceQuota:
    enabled: true
    hard:
      requests.cpu: '12'
      requests.memory: 32Gi
      limits.cpu: '20'
      limits.memory: 40Gi
      requests.storage: 2Ti
      persistentvolumeclaims: '100'
      pods: '300'

storageTiers:
  hot:
    enabled: true
    storageClassName: production-durable
  cold:
    enabled: true
    objectStore:
      enabled: true
      provider: s3-compatible
      bucket: urban-platform-production-backups
      prefix: urban-platform
      secretRef:
        name: production-backup-credentials
        namespace: urban-platform

backup:
  enabled: true
  profile: production
  velero:
    enabled: true
    installOperator: true
    provider: aws
    bucket: urban-platform-production-backups
    prefix: urban-platform
    secretRef:
      name: production-backup-credentials
      namespace: velero
    snapshotsEnabled: true
    nodeAgentEnabled: true
    schedule:
      enabled: true
      name: daily-platform-backup
      cron: "0 */6 * * *"
      ttl: 2160h0m0s
  rke2Etcd:
    enabled: true
    schedule: "0 */6 * * *"
    retention: 30
  imageArchives:
    enabled: true
    retention: 30d

ingress:
  tls:
    enabled: true
    createSecret: false
    certManager:
      enabled: false
      issuerName: production-issuer
      issuerKind: ClusterIssuer
    selfSigned:
      enabled: false

secretManagement:
  enabled: true
  provider: external-secrets
  providerAdapters:
    kubernetesDirect:
      enabled: false
    externalSecrets:
      enabled: true
    vault:
      enabled: true
  externalSecrets:
    registryCredentials:
      enabled: true
    clickhouseSinkCredentials:
      enabled: true
      targetName: clickhouse-sink-credentials
      namespace: urban-platform
      type: Opaque
      creationPolicy: Owner
      immutable: false
      data:
        - secretKey: username
          remoteRef:
            key: example/urban-platform/clickhouse/sink-username
        - secretKey: password
          remoteRef:
            key: example/urban-platform/clickhouse/sink-password
    databaseBackupCredentials:
      enabled: true
      targetName: production-backup-credentials
      namespace: urban-platform
      type: Opaque
      creationPolicy: Owner
      immutable: false
      data:
        - secretKey: accessKeyId
          remoteRef:
            key: example/urban-platform/backup/access-key-id
        - secretKey: secretAccessKey
          remoteRef:
            key: example/urban-platform/backup/secret-access-key
    veleroBackupCredentials:
      enabled: true
      targetName: production-backup-credentials
      namespace: velero
      type: Opaque
      creationPolicy: Owner
      immutable: false
      data:
        - secretKey: cloud
          remoteRef:
            key: example/urban-platform/backup/velero-cloud
    ingressTls:
      enabled: true

autoscaling:
  enabled: true

observability:
  profile: production
  prometheus:
    enabled: true
  grafana:
    enabled: true

monitoring:
  enabled: true
  prometheusRules:
    enabled: true
    kafkaClickhouse:
      enabled: true
      consumerGroup: connect-clickhouse-bemobile-sink
      sourceTopic: beMobile
      deadLetterTopic: beMobile.clickhouse.dlq
      maximumConsumerLag: 100000
  serviceMonitors:
    enabled: false

webserver:
  ingress:
    enabled: true
  providers:
    nginx:
      autoscaling:
        enabled: true

messaging:
  kafka:
    enabled: true
    provider: strimzi
    mode: operator
    versionProfile: apache-4.3-strimzi
    compatibilitySecurityContext: false
    replicas: 3
    storage:
      className: production-durable
      size: 100Gi
    image:
      repository: quay.io/strimzi/kafka
      tag: 1.1.0-kafka-4.3.0
    strimzi:
      apiVersion: kafka.strimzi.io/v1
      kafkaVersion: 4.3.0
      operatorImage:
        repository: quay.io/strimzi/operator
        tag: 1.1.0
      useCustomKafkaImage: true
      deleteClaim: false
      listeners:
        plain:
          enabled: false
        tls:
          enabled: true
          authentication: tls
      authorization:
        enabled: true
        type: simple
        superUsers: []
      rack:
        enabled: true
        topologyKey: topology.kubernetes.io/zone
      brokerConfig:
        autoCreateTopics: false
        uncleanLeaderElection: false
        numPartitions: 6
      scheduling:
        enabled: true
      podDisruptionBudget:
        maxUnavailable: 1
      kafkaExporter:
        enabled: true
        topicRegex: .*
        groupRegex: .*
      cruiseControl:
        enabled: true
      metrics:
        enabled: true
        configMapName: kafka-metrics
        configMapKey: kafka-metrics-config.yml
      topics:
        enabled: true
        definitions:
          - name: beMobile
            partitions: 6
            replicas: 3
            config:
              min.insync.replicas: 2
              cleanup.policy: delete
              retention.ms: 604800000
          - name: beMobile.clickhouse.dlq
            partitions: 3
            replicas: 3
            config:
              min.insync.replicas: 2
              cleanup.policy: delete
              retention.ms: 2592000000
      connect:
        enabled: true
        name: clickhouse-connect
        replicas: 3
        image:
          repository: urban-platform/clickhouse-kafka-connect
          tag: 1.4.0
        build:
          enabled: false
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2
            memory: 4Gi
        metrics:
          enabled: true
          configMapName: clickhouse-connect-metrics
          configMapKey: connect-metrics-config.yml
        # A private production overlay must add the ClickHouse load-balancer
        # CIDR(s); Kubernetes NetworkPolicy cannot authorize an FQDN directly.
        networkPolicy:
          enabled: true
          egressCidrs: []
        groupId: clickhouse-connect
        configStorageTopic: clickhouse-connect-configs
        offsetStorageTopic: clickhouse-connect-offsets
        statusStorageTopic: clickhouse-connect-status
        tls:
          enabled: true
          clusterCaSecret: kafka-cluster-ca-cert
        authentication:
          type: tls
          userSecret: clickhouse-connect
        credentialsSecret:
          name: clickhouse-sink-credentials
          usernameKey: username
          passwordKey: password
        connector:
          enabled: true
          name: clickhouse-bemobile-sink
          consumerGroup: connect-clickhouse-bemobile-sink
          tasksMax: 6
          topic: beMobile
          table: bemobile
          database: sensordb
          hostname: clickhouse.example.invalid
          port: 8443
          ssl: true
          jdbcConnectionProperties: '?sslmode=STRICT'
          exactlyOnce: true
          # Set this in the private overlay for self-managed replicated ClickHouse.
          # ClickHouse Cloud and single-cluster endpoints can leave it empty.
          keeperOnCluster: ''
          ignorePartitionsWhenBatching: false
          bufferCount: 0
          bufferFlushTimeMs: 0
          errors:
            tolerance: all
            retryTimeoutMs: 300000
            retryDelayMaxMs: 10000
            logEnable: true
            logIncludeMessages: false
            deadLetterTopic: beMobile.clickhouse.dlq
            deadLetterReplicationFactor: 3
          consumer:
            isolationLevel: read_committed
            maxPollRecords: 10000
            maxPollIntervalMs: 600000
            fetchMaxBytes: 52428800
            maxPartitionFetchBytes: 5242880
            fetchMinBytes: 1048576
            fetchMaxWaitMs: 500
            heartbeatIntervalMs: 3000
            sessionTimeoutMs: 30000
          clickhouseSettings:
            asyncInsert: true
            waitForAsyncInsert: true
            asyncInsertMaxDataSize: 16777216
            asyncInsertBusyTimeoutMs: 1500
            connectionTimeoutMs: 30000
            socketTimeoutMs: 300000
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2
          memory: 2Gi
    ui:
      enabled: false
  redis:
    compatibilitySecurityContext: false
    replicas: 3
    storage:
      className: production-durable
      size: 20Gi
    sentinel:
      enabled: true

databases:
  defaultInstances: 3
  storageOverride:
    size: 20Gi
    className: production-durable
  backup:
    enabled: true
    retentionPolicy: 30d
    compression: gzip
    objectStore:
      enabled: true
      provider: s3-compatible
      bucket: urban-platform-production-backups
      prefix: urban-platform/databases
      secretRef:
        name: production-backup-credentials
        namespace: urban-platform
        accessKeyIdKey: accessKeyId
        secretAccessKeyKey: secretAccessKey
    schedule:
      enabled: true
      cron: "0 0 */6 * * *"
