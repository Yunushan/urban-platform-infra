version: '3'

tasks:
  validate:
    cmds:
      - python3 scripts/validate.py
      - python3 scripts/images/validate-images.py
  image-policy:
    cmds:
      - python3 scripts/images/validate-images.py
  lint:
    cmds:
      - yamllint .
      - shellcheck $(git ls-files '*.sh')
  configure:
    vars:
      ENGINE: '{{.ENGINE | default "rke2"}}'
      INGRESS: '{{.INGRESS | default "traefik"}}'
      WEB: '{{.WEB | default "nginx"}}'
      DB: '{{.DB | default "postgresql"}}'
      OBS: '{{.OBS | default "elasticsearch"}}'
    cmds:
      - python3 scripts/configure.py --engine {{.ENGINE}} --ingress-controller {{.INGRESS}} --webserver {{.WEB}} --database {{.DB}} --observability {{.OBS}}
  preflight:
    vars:
      ENV: '{{.ENV | default "prod"}}'
      ENGINE: '{{.ENGINE | default "rke2"}}'
      INVENTORY: 'inventories/{{.ENV}}/hosts.yml'
    cmds:
      - ansible-playbook -i {{.INVENTORY}} ansible/playbooks/preflight.yml -e cluster_engine={{.ENGINE}} -e deployment_environment={{.ENV}}
  bootstrap-check:
    vars:
      ENV: '{{.ENV | default "prod"}}'
      ENGINE: '{{.ENGINE | default "rke2"}}'
      INVENTORY: 'inventories/{{.ENV}}/hosts.yml'
    cmds:
      - ansible-playbook -i {{.INVENTORY}} ansible/playbooks/bootstrap.yml -e cluster_engine={{.ENGINE}} -e deployment_environment={{.ENV}} --check --diff
  install-cluster-check:
    vars:
      ENV: '{{.ENV | default "prod"}}'
      ENGINE: '{{.ENGINE | default "rke2"}}'
      INVENTORY: 'inventories/{{.ENV}}/hosts.yml'
    cmds:
      - ansible-playbook -i {{.INVENTORY}} ansible/playbooks/install-cluster.yml -e cluster_engine={{.ENGINE}} -e deployment_environment={{.ENV}} --check --diff
  package-chart:
    cmds:
      - mkdir -p dist
      - helm dependency build helm/urban-platform-infra
      - helm lint helm/urban-platform-infra
      - helm package helm/urban-platform-infra -d dist
  release-evidence:
    deps:
      - package-chart
    cmds:
      - >-
        helm template urban-platform-infra helm/urban-platform-infra
        --namespace urban-platform
        -f helm/urban-platform-infra/values.yaml
        > dist/rendered.yaml
      - >-
        helm template urban-platform-infra helm/urban-platform-infra
        --namespace urban-platform
        -f helm/urban-platform-infra/values.yaml
        -f helm/urban-platform-infra/values-production.yaml
        --api-versions kafka.strimzi.io/v1/Kafka
        --api-versions kafka.strimzi.io/v1/KafkaNodePool
        --api-versions kafka.strimzi.io/v1/KafkaTopic
        --api-versions kafka.strimzi.io/v1/KafkaUser
        --api-versions kafka.strimzi.io/v1/KafkaConnect
        --api-versions kafka.strimzi.io/v1/KafkaConnector
        --api-versions monitoring.coreos.com/v1/PodMonitor
        --api-versions cert-manager.io/v1/Certificate
        --api-versions cert-manager.io/v1/ClusterIssuer
        > dist/production-rendered.yaml
      - python3 tests/policy/basic_policy.py dist/production-rendered.yaml
      - python3 tests/policy/production_render.py dist/production-rendered.yaml
      - >-
        python3 scripts/release/generate_sbom.py
        --chart helm/urban-platform-infra
        --dist dist
        --rendered dist/rendered.yaml
        --production-rendered dist/production-rendered.yaml
        --sbom dist/urban-platform-infra.spdx.json
        --manifest dist/release-evidence.json
        --checksums dist/SHA256SUMS
      - >-
        test -n "{{.RELEASE_TAG | default ""}}"
        && python3 scripts/release/verify_release_evidence.py
        --chart helm/urban-platform-infra
        --policy config/supply-chain-policy.yaml
        --tag "{{.RELEASE_TAG | default ""}}"
        --report reports/release-evidence-verification.md
  deploy:
    vars:
      ENV: '{{.ENV | default "prod"}}'
      ENGINE: '{{.ENGINE | default "rke2"}}'
      INVENTORY: 'inventories/{{.ENV}}/hosts.yml'
      TOPOLOGY: '{{.TOPOLOGY | default "three-node-ha"}}'
      CONFIRM_PROD: '{{.CONFIRM_PROD | default "false"}}'
      DEPLOY_PRIVATE_VALUES: '{{.DEPLOY_PRIVATE_VALUES | default ""}}'
    cmds:
      - >-
        make deploy
        ENV="{{.ENV}}"
        ENGINE="{{.ENGINE}}"
        INVENTORY="{{.INVENTORY}}"
        TOPOLOGY="{{.TOPOLOGY}}"
        CONFIRM_PROD="{{.CONFIRM_PROD}}"
        DEPLOY_PRIVATE_VALUES="{{.DEPLOY_PRIVATE_VALUES}}"
  observability-status:
    cmds:
      - kubectl -n urban-platform get prometheusrules.monitoring.coreos.com,servicemonitors.monitoring.coreos.com 2>/dev/null || true
      - kubectl -n observability get pods,svc 2>/dev/null || true
